services:
  - type: web
    name: backend-gygy
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: espirito_santo
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        value: https://uzzbgjwpfxokagrvmdoa.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: EMERGENT_API_KEY
        sync: false
      - key: EMERGENT_LLM_KEY
        sync: false
      - key: BAILEYS_INTERNAL_TOKEN
        value: legalflow-baileys-2026
