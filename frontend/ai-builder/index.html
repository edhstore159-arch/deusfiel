<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Builder</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="layout">
    <div class="left panel">
      <h3>AI Builder</h3>
      <div id="chatHistory" class="chat-history"></div>
      <textarea id="chatInput" placeholder="Type commands here..."></textarea>
      <div class="controls">
        <button id="sendBtn">Send</button>
        <select id="modelSelect"><option>qwen2.5-coder:7b</option><option>qwen2.5:3b-instruct</option></select>
      </div>
    </div>

    <div class="center panel">
      <h4>Progress & Plan</h4>
      <div id="progress" class="progress"></div>
      <h4>Plan</h4>
      <pre id="plan" class="plan"></pre>
    </div>

    <div class="right panel">
      <h4>Changed Files</h4>
      <div id="changedFiles" class="files"></div>
      <h4>Diff</h4>
      <pre id="diffView" class="diff"></pre>
      <div class="actions">
        <button id="approve">Approve Changes</button>
        <button id="reject">Reject Changes</button>
        <button id="runTests">Run Tests</button>
        <button id="revert">Revert Last Change</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
