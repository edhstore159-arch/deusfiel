  - type: web
    name: fcc-server
    runtime: python
    plan: starter
    autoDeploy: true
    rootDir: fcc-proxy
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8082"
      - key: FCC_AUTH_TOKEN
        value: freecc
      - key: FCC_MODEL
        value: gpt-4o-mini
      - key: EMERGENT_API_KEY
        sync: false
      - key: EMERGENT_LLM_KEY
        sync: false
      - key: EMERGENT_ENABLED
        value: "true"
      - key: OLLAMA_URL
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: qwen2.5:3b-instruct

  # baileys-service standalone (sidecar para o FastAPI backend) - 24/7 no Render
  - type: web
    name: baileys-sidecar
    runtime: node
    plan: starter
    rootDir: baileys-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: baileys-sidecar-auth
      mountPath: /opt/render/project/src/baileys-service/auth_info
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: BAILEYS_INTERNAL_TOKEN
        value: legalflow-baileys-2026
      - key: BACKEND_WEBHOOK
        value: https://kenia-whatsapp-backend.onrender.com/api/whatsapp/webhook/baileys
      - key: KEEP_ALIVE_INTERVAL_MS
        value: "25000"
      - key: CONNECT_TIMEOUT_MS
        value: "60000"

