        value: https://kenia-whatsapp-backend.onrender.com
      - key: VITE_FCC_URL
        value: https://fcc-server.onrender.com
      - key: VITE_GROQ_API_KEY
        sync: false
      - key: VITE_NEMOTRON_API_KEY
        sync: false
      - key: VITE_ZAI_API_KEY
        sync: false
      - key: VITE_ZEN_API_KEY
        sync: false
      - key: VITE_GEMINI_API_KEY
        sync: false
      - key: VITE_OPENROUTER_API_KEY
        sync: false
      - key: VITE_EMERGENT_API_KEY
        sync: false
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
  - type: web
    name: kenia-whatsapp-backend
    runtime: node
    plan: starter
    renderSubdomainPolicy: enabled
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: baileys-auth
      mountPath: /opt/render/project/src/backend/auth
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: AUTH_DIR
        value: /opt/render/project/src/backend/auth
      - key: SUPABASE_URL
        value: https://uzzbgjwpfxokagrvmdoa.supabase.co
      - key: SUPABASE_ANON_KEY
