      - key: EMERGENT_LLM_KEY
        value: sk-emergent-674Be7e5e2c8b9a08D
      - key: EMERGENT_ENABLED
        value: "true"

  # baileys-service standalone (sidecar para o FastAPI backend) - 24/7 no Render
  - type: web
    name: baileys-sidecar
    runtime: node
    plan: starter
    rootDir: baileys-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: baileys-sidecar-auth
      mountPath: /opt/render/project/src/baileys-service/auth_info
      sizeGB: 1
    envVars:
