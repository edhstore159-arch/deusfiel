services:
  - type: web
    name: jatai-app
    runtime: static
    autoDeploy: true
    buildCommand: npm install --legacy-peer-deps && npm run build
    envVars:
      - key: FORCE_RENDER_DEPLOY
        value: " inf "
    envVars:
      - key: RENDER_BUILD_NUM
        value: "1787511200": npm install --legacy-peer-deps && npm run build
    envVars:
      - key: RENDER_DEPLOY_TOKEN_827683: 827683
        value: 827683: npm install --legacy-peer-deps && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://uzzbgjwpfxokagrvmdoa.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV6emJnandwZnhva2FncnZtZG9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNDk2NzgsImV4cCI6MjA5OTgyNTY3OH0.4lX8OydcmKTx_U2A0MvMCs1-ZBKpQUcKFjSFsNfBttc
      - key: VITE_SUPABASE_PROJECT_ID
