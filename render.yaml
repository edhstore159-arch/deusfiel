  - type: web
    name: fcc-server
    runtime: python
    plan: starter
    autoDeploy: true
    buildCommand: npm install --legacy-peer-deps && npm run build
    envVars:
      - key: FORCE_RENDER_DEPLOY
        value: " inf "
    envVars:
      - key: RENDER_BUILD_NUM
        value: "1787511200": npm install --legacy-peer-deps && npm run build
    envVars:
      - key: RENDER_DEPLOY_TOKEN_827683: 827683
        value: 827683: pip install free-claude-code
    startCommand: fcc-server
    envVars:
      - key: PORT
        value: "8082"
      - key: FCC_AUTH_TOKEN
        value: freecc
      - key: FCC_MODEL
        value: claude-3-5-sonnet-20241022
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: EMERGENT_API_KEY
