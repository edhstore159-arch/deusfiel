services:
  # ============================================
  # FRONTEND - Static Site (Vite + React) - GRÁTIS ilimitado
  # ============================================
  - type: web
    name: deusfiel-frontend
    runtime: static
    autoDeploy: true
    buildCommand: npm ci --legacy-peer-deps && npm run build
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://uzzbgjwpfxokagrvmdoa.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV6emJnandwZnhva2FncnZtZG9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNDk2NzgsImV4cCI6MjA5OTgyNTY3OH0.4lX8OydcmKTx_U2A0MvMCs1-ZBKpQUcKFjSFsNfBttc
      - key: VITE_SUPABASE_PROJECT_ID
        value: uzzbgjwpfxokagrvmdoa
      - key: VITE_BACKEND_URL
        value: https://deusfiel-backend.onrender.com
      # Chaves sensíveis - configure no dashboard da Render (sync: false)
      - key: VITE_GROQ_API_KEY
        sync: false
      - key: VITE_NEMOTRON_API_KEY
        sync: false
      - key: VITE_ZAI_API_KEY
        sync: false
      - key: VITE_ZEN_API_KEY
        sync: false
      - key: VITE_GEMINI_API_KEY
        sync: false
      - key: VITE_OPENROUTER_API_KEY
        sync: false
      - key: VITE_EMERGENT_API_KEY
        sync: false
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ============================================
  # BACKEND - Node.js (Express + Baileys) - 1º Web Service Free
  # ============================================
  - type: web
    name: deusfiel-backend
    runtime: node
    plan: starter
    autoDeploy: true
    rootDir: backend
    buildCommand: npm ci --legacy-peer-deps
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "8080"
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: espirito_santo
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        value: https://uzzbgjwpfxokagrvmdoa.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: EMERGENT_API_KEY
        sync: false
      - key: EMERGENT_LLM_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ZEN_API_KEY
        sync: false
      - key: FCC_BASE_URL
        value: ""  # vazio = usa fallback Emergent/OpenRouter
      - key: FCC_AUTH_TOKEN
        sync: false
      - key: FCC_MODEL
        value: claude-sonnet-4-5
      - key: FCC_ENABLED
        value: "false"
      - key: OLLAMA_URL
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: qwen2.5:3b-instruct
      - key: BAILEYS_INTERNAL_TOKEN
        sync: false
      - key: KEEP_ALIVE_INTERVAL_MS
        value: "15000"
      - key: RECONNECT_DELAY_MS
        value: "2000"
      - key: RECONNECT_MAX_DELAY_MS
        value: "300000"
      - key: QR_TIMEOUT_MS
        value: "900000"
    disk:
      name: baileys-auth
      mountPath: /opt/render/project/src/backend/auth
      sizeGB: 1