services:
  # ============================================
  # FRONTEND - Static Site (Vite + React)
  # ============================================
  - type: web
    name: deusfiel-frontend
    runtime: static
    autoDeploy: true
    buildCommand: npm ci --legacy-peer-deps && npm run build
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://uzzbgjwpfxokagrvmdoa.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV6emJnandwZnhva2FncnZtZG9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNDk2NzgsImV4cCI6MjA5OTgyNTY3OH0.4lX8OydcmKTx_U2A0MvMCs1-ZBKpQUcKFjSFsNfBttc
      - key: VITE_SUPABASE_PROJECT_ID
        value: uzzbgjwpfxokagrvmdoa
      - key: VITE_BACKEND_URL
        value: https://deusfiel-backend.onrender.com
      - key: VITE_FCC_URL
        value: https://deusfiel-fcc-proxy.onrender.com
      # Chaves sensíveis - configure no dashboard da Render (sync: false)
      - key: VITE_GROQ_API_KEY
        sync: false
      - key: VITE_NEMOTRON_API_KEY
        sync: false
      - key: VITE_ZAI_API_KEY
        sync: false
      - key: VITE_ZEN_API_KEY
        sync: false
      - key: VITE_GEMINI_API_KEY
        sync: false
      - key: VITE_OPENROUTER_API_KEY
        sync: false
      - key: VITE_EMERGENT_API_KEY
        sync: false
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ============================================
  # BACKEND - Node.js (Express + Baileys)
  # ============================================
  - type: web
    name: deusfiel-backend
    runtime: node
    plan: starter
    autoDeploy: true
    rootDir: backend
    buildCommand: npm ci --legacy-peer-deps
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "8080"
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: espirito_santo
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        value: https://uzzbgjwpfxokagrvmdoa.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: EMERGENT_API_KEY
        sync: false
      - key: EMERGENT_LLM_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ZEN_API_KEY
        sync: false
      - key: FCC_BASE_URL
        value: https://deusfiel-fcc-proxy.onrender.com
      - key: FCC_AUTH_TOKEN
        sync: false
      - key: FCC_MODEL
        value: claude-sonnet-4-5
      - key: FCC_ENABLED
        value: "true"
      - key: OLLAMA_URL
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: qwen2.5:3b-instruct
      - key: BAILEYS_INTERNAL_TOKEN
        sync: false
      - key: KEEP_ALIVE_INTERVAL_MS
        value: "15000"
      - key: RECONNECT_DELAY_MS
        value: "2000"
      - key: RECONNECT_MAX_DELAY_MS
        value: "300000"
      - key: QR_TIMEOUT_MS
        value: "900000"
    disk:
      name: baileys-auth
      mountPath: /opt/render/project/src/backend/auth
      sizeGB: 1

  # ============================================
  # FCC PROXY - Python FastAPI (proxy para FCC/outros LLMs)
  # ============================================
  - type: web
    name: deusfiel-fcc-proxy
    runtime: python
    plan: starter
    autoDeploy: true
    rootDir: fcc-proxy
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8082"
      - key: FCC_URL
        sync: false  # Configure no dashboard se tiver FCC server hospedado
      - key: FCC_AUTH_TOKEN
        sync: false
      - key: FCC_MODEL
        value: claude-sonnet-4-5
      - key: EMERGENT_API_KEY
        sync: false
      - key: EMERGENT_LLM_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ZEN_API_KEY
        sync: false
      - key: OLLAMA_URL
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: qwen2.5:3b-instruct

  # ============================================
  # BAILEYS SIDECAR - Node.js (WhatsApp connection 24/7)
  # ============================================
  - type: web
    name: deusfiel-baileys
    runtime: node
    plan: starter
    autoDeploy: true
    rootDir: baileys-service
    buildCommand: npm ci --legacy-peer-deps
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: baileys-sidecar-auth
      mountPath: /opt/render/project/src/baileys-service/auth_info
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: BAILEYS_INTERNAL_TOKEN
        sync: false
      - key: BACKEND_WEBHOOK
        value: https://deusfiel-backend.onrender.com/api/whatsapp/webhook/baileys
      - key: KEEP_ALIVE_INTERVAL_MS
        value: "25000"
      - key: CONNECT_TIMEOUT_MS
        value: "60000"