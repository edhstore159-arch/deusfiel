services:
  - type: web
    name: jatai-app
    runtime: static
    autoDeploy: true
    buildCommand: npm ci --legacy-peer-deps && npm run build
    envVars:
      - key: FORCE_RENDER_DEPLOY
        value: "fix-nemotron-keys-1787677000"
      - key: VITE_SUPABASE_URL
        value: https://uzzbgjwpfxokagrvmdoa.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV6emJnandwZnhva2FncnZtZG9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNDk2NzgsImV4cCI6MjA5OTgyNTY3OH0.4lX8OydcmKTx_U2A0MvMCs1-ZBKpQUcKFjSFsNfBttc
      - key: VITE_SUPABASE_PROJECT_ID
        value: uzzbgjwpfxokagrvmdoa
      - key: VITE_BACKEND_URL
        value: https://backend-gygy.onrender.com
      - key: VITE_FCC_URL
        value: https://fcc-server.onrender.com
      - key: VITE_GROQ_API_KEY
        sync: false
      - key: VITE_NEMOTRON_API_KEY
        sync: false
      - key: VITE_ZAI_API_KEY
        sync: false
      - key: VITE_ZEN_API_KEY
        sync: false
      - key: VITE_GEMINI_API_KEY
        sync: false
      - key: VITE_OPENROUTER_API_KEY
        sync: false
      - key: VITE_EMERGENT_API_KEY
        sync: false
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
  # Backend principal: backend-gygy.onrender.com (já existe e funciona)
  # O serviço kenia-whatsapp-backend foi suspenso - use backend-gygy

  - type: web
    name: fcc-server
    runtime: python
    plan: starter
    autoDeploy: true
    rootDir: fcc-proxy
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8082"
      - key: FCC_AUTH_TOKEN
        value: freecc
      - key: FCC_MODEL
        value: gpt-4o-mini
      - key: EMERGENT_API_KEY
        sync: false
      - key: EMERGENT_LLM_KEY
        sync: false
      - key: EMERGENT_ENABLED
        value: "true"
      - key: OLLAMA_URL
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: qwen2.5:3b-instruct

  # baileys-service standalone (sidecar para o FastAPI backend) - 24/7 no Render
  - type: web
    name: baileys-sidecar
    runtime: node
    plan: starter
    rootDir: baileys-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: baileys-sidecar-auth
      mountPath: /opt/render/project/src/baileys-service/auth_info
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: BAILEYS_INTERNAL_TOKEN
        value: legalflow-baileys-2026
      - key: BACKEND_WEBHOOK
        value: https://backend-gygy.onrender.com/api/whatsapp/webhook/baileys
      - key: KEEP_ALIVE_INTERVAL_MS
        value: "25000"
      - key: CONNECT_TIMEOUT_MS
        value: "60000"

  # fcc-server (Claude 3.5 Sonnet grátis)
