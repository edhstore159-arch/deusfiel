version: '3.8'

services:
  # Frontend: Vite + React + shadcn/ui
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kenia-frontend
    restart: unless-stopped
    environment:
      PORT: 4173
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:3000}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
      VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
      VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY: ${VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY}
    ports:
      - "4173:4173"
    networks:
      - kenia-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Backend: Express + Baileys (WhatsApp)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kenia-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-${VITE_SUPABASE_PUBLISHABLE_KEY}}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
    ports:
      - "3000:3000"
    networks:
      - kenia-network
    volumes:
      # Persist WhatsApp auth state across container restarts
      - kenia_whatsapp_auth:/app/backend/auth_info_baileys
      # For development: mount backend code for live reload
      # Uncomment the following line if you want hot-reload during development:
      # - ./backend:/app/backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  kenia_whatsapp_auth:
    driver: local

networks:
  kenia-network:
    driver: bridge
